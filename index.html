<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scorched Earth</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600;700&display=swap');
  :root {
    --bg:#050608; --panel:#0f141bcc; --surface:#1a2330; --stroke:#2a3a4a;
    --text:#d6eeff; --dim:#7f93a8; --cyan:#00e5ff; --blue:#6083ff;
    --teal:#2ed4b7; --mint:#9bffcc; --amber:#ffb347; --danger:#ff4d4d;
    --p1:#3ee07a; --p2:#ff5a4a; --shield:#00e5ff; --armor:#ffb347; --fuel:#9bffcc; --gold:#ffb347;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%;
    background:
      radial-gradient(900px 380px at 80% -10%, rgba(40,80,140,.35), transparent 55%),
      linear-gradient(180deg,#07090d 0%, #050608 100%);
    color:var(--text);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    user-select:none;
  }
  #wrap { max-width:1320px; margin:0 auto; padding:14px 16px 16px; display:flex; flex-direction:column; height:100%; gap:10px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--stroke); padding-bottom:8px; }
  h1 { font-family: Orbitron, sans-serif; font-size:18px; letter-spacing:.18em; text-transform:uppercase; margin:0; font-weight:700; color:#e8f6ff; text-shadow:0 0 16px rgba(0,229,255,.35); }
  h1 span { opacity:.45; letter-spacing:.14em; font-weight:500; margin-left:10px; font-size:11px; }
  #status {
    font-family: Orbitron, sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--cyan); padding:7px 12px; border:1px solid rgba(0,229,255,.35);
    border-radius:4px; background:rgba(0,229,255,.06); box-shadow:0 0 16px rgba(0,229,255,.12) inset;
  }
  #stage { display:grid; grid-template-columns:210px 1fr; gap:12px; flex:1; min-height:0; align-items:stretch; }
  canvas {
    width:100%; height:100%; cursor:crosshair; min-height:360px; background:#000;
    border-radius:6px; border:1px solid var(--stroke);
    box-shadow:0 0 0 1px rgba(0,229,255,.08), 0 20px 50px rgba(0,0,0,.5);
  }
  #rack { display:flex; flex-direction:column; gap:5px; overflow:auto; padding-right:2px; }
  .wep {
    position:relative; border:1px solid var(--stroke); background:rgba(15,20,27,.9); color:var(--text);
    padding:8px 10px; font:600 11px Inter, system-ui, sans-serif; cursor:pointer;
    border-radius:4px; width:100%; text-align:left; letter-spacing:.02em;
    transition:border-color .12s, box-shadow .12s, color .12s;
  }
  .wep:hover { border-color:rgba(0,229,255,.45); color:#fff; box-shadow:0 0 12px rgba(0,229,255,.12); }
  .wep.on { border-color:var(--cyan); color:var(--cyan); background:rgba(0,229,255,.1); box-shadow:0 0 14px rgba(0,229,255,.2); }
  .wep small { opacity:.55; font-weight:500; margin-left:6px; }
  .wep[data-tip]:hover::after {
    content:attr(data-tip);
    position:absolute; left:calc(100% + 8px); top:50%; transform:translateY(-50%);
    width:max-content; max-width:210px; padding:8px 10px; border-radius:4px;
    background:#0f141b; color:#d6eeff; border:1px solid rgba(0,229,255,.3);
    font:500 11px Inter, system-ui, sans-serif; line-height:1.35; z-index:20;
    box-shadow:0 0 20px rgba(0,229,255,.15); pointer-events:none;
  }
  #hud { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; }
  .panel {
    background:rgba(15,20,27,.88); border:1px solid var(--stroke); padding:12px 14px;
    display:flex; flex-direction:column; gap:8px; border-radius:6px;
  }
  .panel.p1 { border-color:rgba(62,224,122,.35); }
  .panel.p2 { border-color:rgba(255,90,74,.35); }
  .row { display:flex; gap:14px; align-items:center; justify-content:space-between; }
  .stat b { display:block; font-family: Orbitron, sans-serif; font-variant-numeric:tabular-nums; font-size:16px; }
  .stat label { display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:0; }
  .meters { display:flex; flex-direction:column; gap:6px; flex:1; }
  .meter { display:grid; grid-template-columns:36px 1fr 28px; gap:8px; align-items:center; font-size:11px; color:var(--dim); }
  .bar { height:6px; border-radius:2px; background:rgba(255,255,255,.06); overflow:hidden; }
  .bar > i { display:block; height:100%; width:var(--v,50%); }
  .bar.shield > i { background:linear-gradient(90deg,#147a9a,var(--cyan)); box-shadow:0 0 8px var(--cyan); }
  .bar.armor > i { background:linear-gradient(90deg,#a86a20,var(--armor)); }
  .bar.fuel > i { background:linear-gradient(90deg,#2a8a5a,var(--fuel)); }
  .bar.power > i { background:linear-gradient(90deg,#3a5adf,var(--blue)); }
  #wind {
    min-width:160px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; color:var(--cyan); background:rgba(15,20,27,.88); border:1px solid rgba(0,229,255,.25);
    border-radius:6px; font-family: Orbitron, sans-serif; font-size:13px; letter-spacing:.1em;
  }
  #wind small { color:var(--dim); font-family: Inter, sans-serif; font-size:9px; letter-spacing:.18em; text-transform:uppercase; }
  #msg { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Scorched Earth <span>artillery · <em id='gpuTag'>gpu</em></span></h1>
    <div id="status">Player 1</div>
  </header>
  <div id="stage">
    <div id="rack"></div>
    <canvas id="c" width="1000" height="540"></canvas>
  </div>
  <div id="hud">
    <div class="panel p1">
      <div class="row">
        <div class="stat"><label>Angle</label><b><span id="a1">50</span>°</b></div>
        <div class="stat"><label>Power</label><b><span id="p1">60</span></b></div>
      </div>
      <div class="meters">
        <div class="meter"><span>Shd</span><div class="bar shield" id="sb1"><i></i></div><span id="s1">40</span></div>
        <div class="meter"><span>Arm</span><div class="bar armor" id="hb1"><i></i></div><span id="h1">55</span></div>
        <div class="meter"><span>Fuel</span><div class="bar fuel" id="fb1"><i></i></div><span id="f1">100</span></div>
        <div class="meter"><span>Pow</span><div class="bar power" id="pb1"><i></i></div><span> </span></div>
      </div>
    </div>
    <div id="wind"><small>Wind</small><span id="windVal">0</span></div>
    <div class="panel p2">
      <div class="row">
        <div class="stat"><label>Power</label><b><span id="p2">60</span></b></div>
        <div class="stat"><label>Angle</label><b><span id="a2">130</span>°</b></div>
      </div>
      <div class="meters">
        <div class="meter"><span>Shd</span><div class="bar shield" id="sb2"><i></i></div><span id="s2">40</span></div>
        <div class="meter"><span>Arm</span><div class="bar armor" id="hb2"><i></i></div><span id="h2">55</span></div>
        <div class="meter"><span>Fuel</span><div class="bar fuel" id="fb2"><i></i></div><span id="f2">100</span></div>
      </div>
    </div>
  </div>
  <div id="msg">1–7 weapons · A/D move · arrows aim · Space fire · R new map <button class="wep" id="mute">Sound on</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true, colorSpace:'srgb' }) || canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const _gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
  const GPU_OK = !!_gl;
  const GPU_INFO = GPU_OK ? ((_gl.getExtension('WEBGL_debug_renderer_info') && _gl.getParameter(_gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL)) || 'WebGL') : 'software canvas';
  const dirtTex=document.createElement('canvas'); dirtTex.width=128; dirtTex.height=128;
  { const d=dirtTex.getContext('2d');
    d.fillStyle='#4a321c'; d.fillRect(0,0,128,128);
    for(let i=0;i<900;i++){ d.fillStyle=`rgba(${80+Math.random()*70|0},${50+Math.random()*40|0},${20+Math.random()*20|0},${0.15+Math.random()*0.35})`; d.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*2,1+Math.random()*2); }
  }
  const dirtPat=ctx.createPattern(dirtTex,'repeat');
  const MATTER_OK = typeof Matter !== 'undefined';
  const engine = MATTER_OK ? Matter.Engine.create({ gravity: { x:0, y:0.85 } }) : null;
  const MWorld = engine ? engine.world : null;
  let groundBits = [];
  const rubble = [];
  function rebuildGround(){
    if(!MATTER_OK) return;
    if(groundBits.length) Matter.World.remove(MWorld, groundBits);
    groundBits = [];
    const step=12;
    for(let x=0;x<W;x+=step){
      const h=heightAt(x+step/2);
      const bh=Math.max(8, H-h);
      const b=Matter.Bodies.rectangle(x+step/2, h+bh/2, step+1, bh, { isStatic:true, friction:0.85, restitution:0.12 });
      groundBits.push(b);
    }
    Matter.World.add(MWorld, groundBits);
  }
  function spawnRubble(x,y,n,color,force=1){
    if(!MATTER_OK) return;
    for(let i=0;i<n;i++){
      const w=rand(3,7), h=rand(2,5);
      const b=Matter.Bodies.rectangle(x+rand(-6,6), y+rand(-4,0), w, h, {
        restitution:0.28, friction:0.55, density:0.0018, frictionAir:0.01
      });
      Matter.Body.setVelocity(b, { x:rand(-2.2,2.2)*force, y:rand(-4.8,-1.2)*force });
      Matter.Body.setAngularVelocity(b, rand(-0.25,0.25));
      Matter.World.add(MWorld, b);
      const c=color||'#6a4a2a';
      rubble.push({ body:b, w, h, color:c, life:rand(420,720) });
    }
  }
  function stepMatter(){
    if(!MATTER_OK) return;
    Matter.Engine.update(engine, 1000/60);
    for(let i=rubble.length-1;i>=0;i--){
      const r=rubble[i]; r.life--;
      if(r.life<=0 || r.body.position.y>H+40){ Matter.World.remove(MWorld, r.body); rubble.splice(i,1); }
    }
  }
  function drawRubble(){
    if(!MATTER_OK) return;
    for(const r of rubble){
      const p=r.body.position;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(r.body.angle);
      ctx.fillStyle=r.color; ctx.fillRect(-r.w/2,-r.h/2,r.w,r.h);
      ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.strokeRect(-r.w/2,-r.h/2,r.w,r.h);
      ctx.restore();
    }
  }
  function clearRubble(){
    if(!MATTER_OK) return;
    rubble.forEach(r=>Matter.World.remove(MWorld,r.body));
    rubble.length=0;
  }

  function heightAt(x){ return state.terrain[clamp(Math.round(x),0,W-1)]; }

  function generateTerrain(){
    const t=state.terrain; let y=GROUND_BASE-rand(90,200), slope=0;
    for(let x=0;x<W;x++){
      slope+=rand(-0.32,0.32); slope*=0.975;
      y+=slope+Math.sin(x*0.011)*0.55+Math.sin(x*0.037)*0.22;
      y=clamp(y,80,GROUND_BASE-8); t[x]=y;
      state.dirtShade[x]=(Math.sin(x*0.07)+Math.sin(x*0.19)+Math.random()*0.4)*0.5;
    }
    for(let p=0;p<5;p++){ const c=t.slice(); for(let x=1;x<W-1;x++) t[x]=(c[x-1]+c[x]*2+c[x+1])/4; }
    state.far=new Float32Array(W); state.mid=new Float32Array(W);
    let fy=GROUND_BASE-rand(160,230), fs=0, my=GROUND_BASE-rand(120,180), ms=0;
    for(let x=0;x<W;x++){
      fs+=rand(-0.2,0.2); fs*=0.98; fy+=fs+Math.sin(x*0.008)*0.4; state.far[x]=clamp(fy,40,GROUND_BASE-80);
      ms+=rand(-0.24,0.24); ms*=0.975; my+=ms+Math.sin(x*0.016)*0.35; state.mid[x]=clamp(my,70,GROUND_BASE-40);
    }
    for(let p=0;p<4;p++){ const a=state.far.slice(), b=state.mid.slice();
      for(let x=1;x<W-1;x++){ state.far[x]=(a[x-1]+a[x]*2+a[x+1])/4; state.mid[x]=(b[x-1]+b[x]*2+b[x+1])/4; }

  function spawnShot(tank,wep,extra={}){

  function fire(){

  function carve(x,y,r){
    for(let i=Math.max(0,Math.floor(x-r-2)); i<Math.min(W,Math.ceil(x+r+2)); i++){
      const dx=i-x; if(Math.abs(dx)>r) continue;
      const hyp=Math.sqrt(Math.max(0,r*r-dx*dx)); const top=y-hyp, bot=y+hyp;
      if(state.terrain[i]<bot && state.terrain[i]>top) state.terrain[i]=bot;
      if(state.terrain[i]<top) state.terrain[i]=bot;
      state.terrain[i]=clamp(state.terrain[i],50,GROUND_BASE);
    }
  }

  const FLUID = {
    nx:80, ny:36, u:null, v:null,
    init(){

    i(x,y){ return y*this.nx+x; },
    worldToCell(x,y){

    sample(x,y){

  function simLanding(me, angle, power, wep, foe){
    const rad=angle*Math.PI/180;
    const speed=power*SPEED_K*(wep.tracer?0.85:wep.heavy?0.62:1);
    let x=me.x+Math.cos(rad)*16, y=me.y-7-Math.sin(rad)*16;
    let vx=Math.cos(rad)*speed, vy=-Math.sin(rad)*speed;
    const gmul=wep.heavy?1.65:1;
    for(let i=0;i<700;i++){
      vx+=state.wind*WIND_K; vy+=G*gmul; x+=vx; y+=vy;
      if(x<2||x>W-2||y>H+30) return 1e9;
      if(Math.hypot(x-foe.x, y-(foe.y-4))<13) return 0;
      if(y>=heightAt(x)) return Math.abs(x-foe.x);
    }
    return 1e9;
  }
  function aimAt(me, foe, wep){
    let bestA=130, bestP=48, best=1e9;
    for(let a=110;a<=160;a+=3){
      for(let p=22;p<=86;p+=4){
        const err=simLanding(me,a,p,wep,foe);
        if(err<best){ best=err; bestA=a; bestP=p; }
      }
    }
    for(let a=bestA-3;a<=bestA+3;a++){
      for(let p=bestP-4;p<=bestP+4;p++){
        if(a<90||a>175||p<10||p>100) continue;
        const err=simLanding(me,a,p,wep,foe);

  const Physics = {
    // Semi-implicit Euler + heightmap collider. Not a full engine:

    stepBody(p, dt=1){

      p.vx += state.wind * WIND_K * dt;
      p.vy += g;
      p.x += p.vx * dt;

    hitGround(p){ return p.y >= this.groundY(p.x); },

      p.x += p.vx;

      } else {

        if((p.wep.mirv||p.wep.cluster||p.wep.flak) && !p.peaked && p.vy>0){
          p.peaked=true;
          if(p.wep.flak){ explodeAt(p.x,p.y,p.wep,p.fromSplit); continue; }
          const n=p.wep.mirv||p.wep.cluster; const baby=wepById('baby');
          state.pendingSplits+=n;
          for(let k=0;k<n;k++){
            const q=spawnShot(state.tanks[state.turn]||state.tanks[0], baby, {fromSplit:true});
            q.x=p.x; q.y=p.y; q.vx=p.vx+rand(-1.8,1.8); q.vy=p.vy+rand(-0.4,0.8); q.fromSplit=true;
            next.push(q);

          continue;
        }
        if(p.wep.delay && p.fused>0 && p.y>=heightAt(p.x)-2){

          if(p.fused<=0){ explodeAt(p.x,p.y,p.wep,p.fromSplit); continue; }
          next.push(p); continue;

      if(p.x<1||p.x>W-1||p.y>H+20){ SFX.stopRoll(p); if(p.fromSplit) state.pendingSplits=Math.max(0,state.pendingSplits-1); continue; }

        if(p.wep.digger && !p.digging){ p.digging=true; p.y=heightAt(p.x)+8; p.vy=1.2; next.push(p); continue; }
        if(p.digging && p.y<heightAt(p.x)+26){ p.y+=1.4; p.x+=Math.sign(p.vx||1)*0.6; next.push(p); continue; }
        explodeAt(p.x,p.y,p.wep,p.fromSplit); if(p.fromSplit) state.pendingSplits=Math.max(0,state.pendingSplits-1); continue;
      }
      next.push(p);
    }
    state.projectiles=next;
  }

      ctx.beginPath(); p.trail.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y)); ctx.stroke();
      const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,10);
      glow.addColorStop(0,'#fff'); glow.addColorStop(0.3,p.wep.color); glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(p.x,p.y,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=p.wep.color; ctx.save(); ctx.translate(p.x,p.y);
      const id=p.wep.id;
      if(id==='anvil'){ ctx.fillRect(-4,-3,8,6); }
      else if(id==='mirv'||id==='cluster'){ ctx.rotate(Math.PI/4); ctx.fillRect(-3,-3,6,6); }
      else if(id==='digger'){ ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(-4,-3); ctx.lineTo(4,-3); ctx.fill(); }
      else if(id==='dirtball'){ ctx.beginPath(); ctx.ellipse(0,0,5,3.5,0,0,Math.PI*2); ctx.fill(); }
      else if(id==='nuke'){ ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill(); }
      else if(id==='charge'){ ctx.fillRect(-3,-3,6,6); ctx.fillStyle='#fff'; ctx.fillRect(-1,-1,2,2); }
      else if(id==='bouncer'){ ctx.beginPath(); ctx.arc(0,0,3.4,0,Math.PI*2); ctx.fill(); }
      else if(id==='flak'){ ctx.fillRect(-1,-4,2,8); ctx.fillRect(-4,-1,8,2); }
      else if(id==='quake'){ ctx.fillRect(-5,-2,10,4); }
      else { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,2.3,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    for(const b of state.booms){
      const a=b.life/b.max;
      ctx.strokeStyle=`rgba(255,240,180,${a*0.7})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(1.6-a),0,Math.PI*2); ctx.stroke();
      const core=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r*(1.2-a*0.3));
      core.addColorStop(0,`rgba(255,255,230,${a})`);
      core.addColorStop(0.35,`rgba(255,160,40,${a*0.7})`);
      core.addColorStop(1,'rgba(80,20,0,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(1.25-a*0.3),0,Math.PI*2); ctx.fill();
    }

    for(const c of state.clouds){
      const k=c.life/c.max, grow=1-k, rise=grow*(c.mega?130:95);
      const cx=c.x, cy=c.y-rise-24;
      const cap=(c.r||50)*(0.85+grow*0.9)*(c.mega?1.25:1);
      ctx.save();
      ctx.globalAlpha=0.25+0.55*k;
      const stem=ctx.createLinearGradient(cx,c.y+8,cx,cy+18);
      stem.addColorStop(0,'rgba(30,22,16,0)');
      stem.addColorStop(0.25,'rgba(55,45,38,0.45)');
      stem.addColorStop(1,'rgba(90,78,68,0.5)');
      ctx.fillStyle=stem;
      const sw=c.mega?18:12;
      ctx.beginPath(); ctx.moveTo(cx-sw,c.y); ctx.quadraticCurveTo(cx-sw*0.4, (c.y+cy)/2, cx-sw*1.1, cy+16);
      ctx.lineTo(cx+sw*1.1, cy+16); ctx.quadraticCurveTo(cx+sw*0.4, (c.y+cy)/2, cx+sw,c.y); ctx.fill();
      const capg=ctx.createRadialGradient(cx, cy-cap*0.15, 4, cx, cy, cap);
      capg.addColorStop(0, `rgba(255,220,160,${0.35*k})`);
      capg.addColorStop(0.22, `rgba(160,120,80,${0.4*k})`);
      capg.addColorStop(0.55, `rgba(70,62,54,${0.65*k})`);
      capg.addColorStop(1, 'rgba(20,16,12,0)');
      ctx.fillStyle=capg;
      ctx.beginPath(); ctx.ellipse(cx, cy, cap*1.35, cap*0.62, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx-cap*0.35, cy+4, cap*0.7, cap*0.42, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+cap*0.38, cy+6, cap*0.65, cap*0.4, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    for(const pt of state.particles){
      const k=pt.life/pt.max;
      const sz=pt.kind==='smoke'? pt.sz*(1.6-k*0.6) : pt.sz*(0.6+k*0.6);
      ctx.globalAlpha=pt.kind==='smoke'? pt.a*k : (pt.add? k : Math.min(1,k*1.2));
      if(pt.add) ctx.globalCompositeOperation='lighter';
      else ctx.globalCompositeOperation='source-over';
      if(pt.kind==='smoke'){
        ctx.fillStyle=`rgba(${pt.r|0},${pt.g0|0},${pt.b|0},1)`;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,sz,0,Math.PI*2); ctx.fill();
      } else if(pt.kind==='ember'){
        const grd=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,sz*2.2);
        grd.addColorStop(0,`rgba(255,255,220,1)`);
        grd.addColorStop(0.45,`rgba(${pt.r|0},${pt.g0|0},${pt.b|0},0.9)`);
        grd.addColorStop(1,'rgba(255,80,0,0)');
        ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(pt.x,pt.y,sz*2.2,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle=`rgba(${pt.r|0},${pt.g0|0},${pt.b|0},1)`;
        ctx.fillRect(pt.x,pt.y,sz,sz);
      }
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.restore();
    if(typeof drawRubble==='function') drawRubble();
    ctx.restore();
  }
  function tick(){
    state.time++; FLUID.step();
    state.tanks.forEach(tk=>{ if(tk.recoil>0) tk.recoil=Math.max(0, tk.recoil-0.07); });
    if(typeof stepMatter==='function') stepMatter();
    if(state.shake>0) state.shake*=0.86;
    for(let i=state.burns.length-1;i>=0;i--){
      const b=state.burns[i]; b.life--;
      if(b.life%4===0) emit(b.x+rand(-6,6), b.y+rand(-8,2), 'ember', 2);
      if(b.life%5===0) emit(b.x+rand(-8,8), b.y-6, 'smoke', 2);
      if(b.life<=0) state.burns.splice(i,1);
    }
    for(let i=state.clouds.length-1;i>=0;i--){ const c=state.clouds[i]; c.life--; if(c.life%8===0) emit(c.x+rand(-12,12), c.y-(1-c.life/c.max)*70-24,'smoke',1); if(c.life<=0) state.clouds.splice(i,1); }
    if(state.phase==='fly') stepProjectiles();
    for(let i=state.booms.length-1;i>=0;i--){ state.booms[i].life--; if(state.booms[i].life<=0) state.booms.splice(i,1); }
    if(state.phase==='fly' && !state.projectiles.length && !state.booms.length) state.phase='boom';
    if(state.phase==='boom' && !state.projectiles.length && !state.booms.length){ state.phase='aim'; nextTurn(); }
    if(state.phase==='aim' && state.turn===1 && state.aiTimer>0){ state.aiTimer--; if(state.aiTimer===0) fire(); }
    for(let i=state.particles.length-1;i>=0;i--){
      const pt=state.particles[i];
      pt.vx*=pt.drag; pt.vy*=pt.drag; pt.vy+=pt.g;
      const [fu,fv]=FLUID.sample(pt.x,pt.y);
      const couple=pt.kind==='smoke'?0: pt.kind==='ember'?0.02:0.015;
      pt.vx+=fu*couple; pt.vy+=fv*couple;
      pt.x+=pt.vx; pt.y+=pt.vy;
      if(pt.kind==='dirt' && pt.y>=heightAt(pt.x)-1){
        pt.y=heightAt(pt.x)-1; pt.vy=0; pt.vx*=0.4; pt.g=0;
        if(Math.abs(pt.vx)<0.04){ pt.vx=0; pt.kind='rubble'; pt.life=Math.max(pt.life, 800); pt.max=Math.max(pt.max,800); }
      }
      pt.life--;
      if(pt.life<=0) state.particles.splice(i,1);
    }
    for(let i=state.fires.length-1;i>=0;i--){
      const f=state.fires[i]; f.y=heightAt(f.x)-2; f.life--;
      if(f.life%6===0){ emit(f.x,f.y-2,'ember',1); emit(f.x,f.y-4,'smoke',1); }
      if(f.life<=0) state.fires.splice(i,1);
    }
    draw(); requestAnimationFrame(tick);
  }

  const keys={};
  window.addEventListener('keydown',e=>{
    keys[e.key]=true;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if(e.key==='r'||e.key==='R') newRound();
    if(e.key===' ' && state.turn===0) fire();
    if(state.turn===0 && state.phase==='aim'){ if(e.key==='0' && WEPS[9]) selectWep(WEPS[9].id); const n=parseInt(e.key,10); if(n>=1&&n<=9 && WEPS[n-1]) selectWep(WEPS[n-1].id); }
  });
  window.addEventListener('keyup',e=>keys[e.key]=false);
  setInterval(()=>{
    if(state.phase!=='aim'||state.turn!==0) return; const t=state.tanks[0];
    if(keys['ArrowLeft']) t.angle=clamp(t.angle+0.7,5,90);
    if(keys['ArrowRight']) t.angle=clamp(t.angle-0.7,5,90);
    if(keys['ArrowUp']) t.power=clamp(t.power+0.55,5,100);
    if(keys['ArrowDown']) t.power=clamp(t.power-0.55,5,100);
    if((keys['a']||keys['A'])&&t.fuel>0){ t.x=clamp(t.x-0.6,18,W-18); t.y=heightAt(t.x)-9; t.fuel=Math.max(0,t.fuel-0.22); }
    if((keys['d']||keys['D'])&&t.fuel>0){ t.x=clamp(t.x+0.6,18,W-18); t.y=heightAt(t.x)-9; t.fuel=Math.max(0,t.fuel-0.22); }
    syncHud();
  },16);
  canvas.addEventListener('click',ev=>{
    if(state.phase!=='aim'||state.turn!==0) return;
    const rect=canvas.getBoundingClientRect();
    const x=(ev.clientX-rect.left)*(W/rect.width), y=(ev.clientY-rect.top)*(H/rect.height);
    const t=state.tanks[0]; t.angle=clamp(Math.atan2(t.y-8-y,x-t.x)*180/Math.PI,5,90); syncHud();
  });
  document.getElementById('mute').onclick=()=>{ SFX.setMuted(!SFX.muted); document.getElementById('mute').textContent=SFX.muted?'Sound off':'Sound on'; if(!SFX.muted){ SFX.ensure(); SFX.decodeAll(); } };
  window.addEventListener('pointerdown',()=>{ SFX.ensure(); SFX.decodeAll(); },{once:true});
  window.addEventListener('keydown',()=>{ SFX.ensure(); SFX.decodeAll(); },{once:true});
  const gt=document.getElementById('gpuTag'); if(gt) gt.textContent=(GPU_OK?'HW '+SCALE.toFixed(1)+'x':'software')+' · '+String(GPU_INFO).split('(')[0].slice(0,28); newRound(); tick();
})();
</script>
